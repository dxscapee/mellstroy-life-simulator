<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#101418" />

  <!-- SDK Яндекса НЕ подключаем статикой: локально он только шумит и ломает ввод.
       Скрипт динамически грузится из services/yandex.ts при запуске внутри iframe платформы. -->

  <title>Idle Tycoon — Skeleton</title>
</head>
<body>
  <div id="app">
    <!-- Слой 1: игровой холст (z-index: 1). Кликам сюда ничего не мешает. -->
    <div id="canvas-host"></div>

    <!-- Слой 2: UI-оверлей (z-index: 10), pointer-events: none, у интерактива — auto. -->
    <div id="ui-root"></div>
  </div>

  <!-- Загрузочный экран: виден, пока грузится стартовый набор текстур.
       Скрывается перед LoadingAPI.ready() (см. src/ui/BootScreen.ts). -->
  <div id="boot-screen">
    <div class="boot-inner">
      <div class="boot-title">IDLE TYCOON</div>
      <div class="boot-bar"><i id="boot-bar-fill"></i></div>
      <div class="boot-status" id="boot-status">Загрузка…</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
